[package]
name = "git-branch-cleanup-cli"
version = "1.1.0"
edition = "2021"
authors = ["Open Source Developer <dev@example.com>"]
description = "A fast CLI utility to clean up merged and stale git branches."

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
colored = "2.1"
regex = "1.10"
indicatif = "0.17"
dialoguer = "0.11"
console = "0.15"